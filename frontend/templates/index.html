<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Four — Choose your opponent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <section class="screen menu-screen">
        <div class="menu-card">
            <h1 class="title">CONNECT<span class="title-four">4</span></h1>
            <p class="subtitle">Choose your game mode</p>

            <div id="opponent-list" class="opponent-list">
                <a class="opponent-btn" href="/game?mode=pvp">
                    <span class="opp-icon">👥</span>
                    <span class="opp-info">
                        <span class="opp-name">Player vs Player</span>
                        <span class="opp-desc">Local duel — for testing &amp; fun</span>
                    </span>
                </a>
                <button id="mode-ai-btn" class="opponent-btn" type="button">
                    <span class="opp-icon">🤖</span>
                    <span class="opp-info">
                        <span class="opp-name">Player vs AI</span>
                        <span class="opp-desc">Face one of our models</span>
                    </span>
                </button>
                <button id="mode-aivai-btn" class="opponent-btn" type="button">
                    <span class="opp-icon">⚔️</span>
                    <span class="opp-info">
                        <span class="opp-name">AI vs AI</span>
                        <span class="opp-desc">Watch two models battle it out</span>
                    </span>
                </button>
            </div>

            <div id="ai-picker" class="ai-picker hidden">
                <label class="ai-picker-label" for="ai-select">Choose your opponent</label>
                <select id="ai-select" class="ai-select"></select>
                <p id="ai-desc" class="opp-desc"></p>
                <div class="ai-option-row">
                    <label class="ai-picker-label" for="order-select">You play</label>
                    <select id="order-select" class="ai-select">
                        <option value="first">First</option>
                        <option value="second">Second</option>
                    </select>
                </div>
                <button id="play-ai-btn" class="primary-btn" type="button">Play</button>
                <button class="ghost-btn back-btn" type="button" data-back>← Back</button>
            </div>

            <div id="aivai-picker" class="ai-picker hidden">
                <label class="ai-picker-label" for="ai1-select">First AI (plays first)</label>
                <select id="ai1-select" class="ai-select"></select>
                <p id="ai1-desc" class="opp-desc"></p>
                <label class="ai-picker-label" for="ai2-select">Second AI</label>
                <select id="ai2-select" class="ai-select"></select>
                <p id="ai2-desc" class="opp-desc"></p>
                <button id="play-aivai-btn" class="primary-btn" type="button">Watch</button>
                <button class="ghost-btn back-btn" type="button" data-back>← Back</button>
            </div>
        </div>

        <div class="floating-discs" aria-hidden="true">
            <div class="f-disc red" style="left:8%;  animation-delay:0s"></div>
            <div class="f-disc yellow" style="left:22%; animation-delay:3s"></div>
            <div class="f-disc red" style="left:78%; animation-delay:1.5s"></div>
            <div class="f-disc yellow" style="left:90%; animation-delay:4.5s"></div>
        </div>
    </section>

    <script type="module" src="{{ url_for('static', filename='js/menu.js') }}"></script>
</body>
</html>
